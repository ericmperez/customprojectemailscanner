# Render Blueprint — Background worker for the email scanning agent
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: worker
    name: licitacion-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: SHEET_NAME
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EMAIL_SEARCH_START_DATE
        sync: false
